name: Packages

# Builds the macOS DMGs, deb, RPM and Arch packages for x86-64 and arm64, and
# the Windows zip and installer. The debs are also checked on Debian 13 (Trixie), which is
# what Raspberry Pi OS is based on. Runs on a version tag (v*) or by hand; the packages are the
# run's artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      windows_only:
        description: Build only the Windows zip and installer
        type: boolean
        default: false

permissions:
  contents: read

# The DRM decoder must build; packages never ship without it by accident.
env:
  DRM_REQUIRED: '1'

jobs:
  linux:
    if: ${{ !inputs.windows_only }}
    strategy:
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install the packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ruby rpm libarchive-tools zstd libasound2-dev pkg-config
          sudo gem install --no-document fpm
      - name: Build the packages
        # The DRM decoder is built in Debian 12 so it runs on older glibc.
        env:
          DRM_DOCKER_IMAGE: rust:1.89-bookworm
        run: ./scripts/make-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: simplehpsdr-linux-${{ runner.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
          if-no-files-found: error

  # The same debs are what Raspberry Pi OS (64-bit) and Debian users install:
  # Trixie / Debian 13, and Bookworm / Debian 12 (the original ANAN G2's CM4
  # images). Check they install with apt there, every bundled library loads,
  # and the app starts and stays up.
  trixie:
    if: ${{ !inputs.windows_only }}
    needs: linux
    strategy:
      matrix:
        include:
          - runner: ubuntu-26.04-arm
            arch: ARM64
            os: trixie
          - runner: ubuntu-26.04
            arch: X64
            os: trixie
          - runner: ubuntu-26.04-arm
            arch: ARM64
            os: bookworm
    runs-on: ${{ matrix.runner }}
    container: debian:${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: simplehpsdr-linux-${{ matrix.arch }}
          path: dist
      - name: Install the deb with apt
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ./dist/simplehpsdr_*.deb
      - name: Check every bundled library resolves
        # Each library is looked up beside its neighbours, as the engine loads
        # its own FFTW before WDSP. liblttng-ust is only for .NET's optional
        # tracing library (libcoreclrtraceptprovider.so) and isn't needed.
        run: |
          missing=$(find /usr/lib/simplehpsdr -type f \( -name '*.so*' -o -name SimpleHPSDR -o -name StationEngine \) |
            while read -r f; do LD_LIBRARY_PATH=$(dirname "$f") ldd "$f" 2>/dev/null | sed "s|^|$f: |"; done |
            grep 'not found' | grep -v 'liblttng-ust' | sort -u || true)
          [ -z "$missing" ] || { echo "$missing"; exit 1; }
      - name: Start it under a virtual display
        run: |
          apt-get install -y --no-install-recommends xvfb xauth
          export HOME=$(mktemp -d)
          set +e
          timeout 30 xvfb-run -a simplehpsdr > run.log 2>&1
          code=$?
          set -e
          tail -40 run.log
          # 124: still running when the timeout stopped it, which is the pass.
          [ "$code" -eq 124 ] || { echo "simplehpsdr exited with $code"; exit 1; }

  dmg:
    if: ${{ !inputs.windows_only }}
    runs-on: macos-26
    strategy:
      matrix:
        rid: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build the DMG
        run: ./scripts/make-dmg.sh ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: simplehpsdr-dmg-${{ matrix.rid }}
          path: artifacts/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build the zip
        shell: bash
        run: ./scripts/make-windows.sh
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $dir = (Get-Item artifacts/win/SimpleHPSDR-*).FullName
          $ver = (Select-Xml -Path src/SimpleHPSDR/SimpleHPSDR.csproj -XPath '//Version').Node.InnerText
          & $iscc /Q "/DAppVersion=$ver" "/DSourceDir=$dir" scripts/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed: $LASTEXITCODE" }
          Get-Item artifacts/*-setup.exe | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: simplehpsdr-windows-x64
          path: |
            artifacts/*.zip
            artifacts/*-setup.exe
          if-no-files-found: error
      - name: Install it
        shell: pwsh
        run: |
          $setup = (Get-Item artifacts/*-setup.exe).FullName
          Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=desktopicon' -Wait
          $dir = "$env:LOCALAPPDATA\Programs\SimpleHPSDR"
          foreach ($f in 'SimpleHPSDR.exe', 'engine\StationEngine.exe', 'unins000.exe') {
            if (-not (Test-Path "$dir\$f")) { throw "installer left out $f" }
          }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\SimpleHPSDR.lnk")) { throw 'no Start menu entry' }
          Write-Host "installed in $dir"
      - name: Start it
        shell: pwsh
        run: ./scripts/smoke-windows.ps1 "$env:LOCALAPPDATA\Programs\SimpleHPSDR" "$pwd/windows-screenshot.png"
      - name: Uninstall it
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\SimpleHPSDR"
          Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\SimpleHPSDR.exe") { throw 'uninstall left the program behind' }
          if (-not (Test-Path "$env:LOCALAPPDATA\SimpleHPSDR")) { throw 'uninstall removed the settings folder' }
          Write-Host 'uninstalled; settings kept'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshot
          path: windows-screenshot.png
